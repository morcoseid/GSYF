<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أجندة خدمة الشباب</title>
<script>(function(){var q=new URLSearchParams(location.search);window.VIEW_KEY=q.get("k")||"";var m=q.get("m");window.START_VIEW=/^\d+$/.test(m||"")?"meet-"+m:"";})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Year at a glance: 12 calm month cards answering 3 questions (busy?, church, trip?). Click a card for that month's meetings. */
:root{
  --bg:#F4F5F1; --surface:#FFFFFF; --fg:#1A221E; --muted:#66726B; --line:#E0E5DE;
  --accent:#1E6B57; --accent-soft:#E2EFE9;
  --calm:#2F7A4F; --calm-soft:#E1F0E6; --mid:#99630A; --mid-soft:#F8EBD3; --busy:#B23A2E; --busy-soft:#F8E2DE; --blue:#2D5AA0; --blue-soft:#E3EBF8;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101513; --surface:#171E1B; --fg:#E7ECE9; --muted:#9AA8A1; --line:#27312D;
  --accent:#5BC2A2; --accent-soft:#1A2E28;
  --calm:#6CCB93; --calm-soft:#16291E; --mid:#E6B05C; --mid-soft:#2E2414; --busy:#EE8678; --busy-soft:#331C19; --blue:#8DB0EC; --blue-soft:#1A2436; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#171E1B; --fg:#E7ECE9; --muted:#9AA8A1; --line:#27312D;
  --accent:#5BC2A2; --accent-soft:#1A2E28;
  --calm:#6CCB93; --calm-soft:#16291E; --mid:#E6B05C; --mid-soft:#2E2414; --busy:#EE8678; --busy-soft:#331C19; --blue:#8DB0EC; --blue-soft:#1A2436; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:var(--accent)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;direction:rtl;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
header h1{font-size:1.6rem}
header .sub{color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 14px;border-radius:8px;cursor:pointer;text-decoration:none}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--surface)!important;font-weight:600}
.note{font-size:.85rem;background:var(--mid-soft);color:var(--mid);padding:8px 12px;border-radius:8px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.now{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.c-head h2{font-size:1.25rem;line-height:1.2}
.c-head small{display:block;color:var(--muted);font-size:.78rem;font-family:var(--body)}
.pill{flex:none;font-family:var(--display);font-weight:600;font-size:.82rem;padding:3px 12px;border-radius:999px}
.p-0{background:var(--calm-soft);color:var(--calm)}.p-1{background:var(--mid-soft);color:var(--mid)}.p-2{background:var(--busy-soft);color:var(--busy)}
.line{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;font-size:.9rem;line-height:1.5}
.line .k{color:var(--muted);font-size:.78rem;padding-top:2px}
.line .v{min-width:0;overflow-wrap:anywhere}
.trip-ok{color:var(--calm);font-weight:500}.trip-maybe{color:var(--mid);font-weight:500}.trip-no{color:var(--busy);font-weight:500}
.why{font-size:.75rem;color:var(--muted)}
/* month page */
.mtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.mtop h2{font-size:1.8rem}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ans{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ans .q{font-size:.8rem;color:var(--muted)}
.ans .a{font-family:var(--display);font-weight:600;font-size:1.05rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.panel h3{font-size:1.05rem;margin-bottom:6px}
.row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding-block:9px;border-top:1px solid var(--line);font-size:.93rem}
.row:first-of-type{border-top:0}
.row .d{font-family:var(--display);font-weight:600;line-height:1.3}
.row .d small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:.75rem}
.row .t{min-width:0}
.row a{font-size:.8rem;color:var(--muted)}
.row.past{opacity:.5}
.empty{color:var(--muted);font-size:.9rem}
footer{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
nav.views{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;max-width:100%;overflow-x:auto}
nav.views a{flex:none;padding:6px 14px;border-radius:7px;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:.9rem}
nav.views a[aria-current="page"]{background:var(--fg);color:var(--bg)}
.next{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 28px}
.next .when{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.next .when h2{font-size:1.4rem}
.blk{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:.93rem}
.blk .lbl{font-size:.78rem;color:var(--muted)}
.feast{color:var(--mid)}
.hint{grid-column:1/-1;font-size:.88rem;background:var(--mid-soft);color:var(--mid);padding:8px 12px;border-radius:8px}
.st{font-size:.75rem;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap}
.st-out{background:var(--blue-soft);color:var(--blue)}.st-off{background:var(--busy-soft);color:var(--busy)}.st-join{background:var(--mid-soft);color:var(--mid)}
.mrow{border-top:1px solid var(--line)}.mrow:first-of-type{border-top:0}
.mrow>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1fr) auto;gap:12px;padding-block:10px;align-items:baseline;font-size:.92rem}
.mrow>summary::-webkit-details-marker{display:none}
.mrow>summary .d{font-family:var(--display);font-weight:600;line-height:1.3}
.mrow>summary .d small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:.74rem}
.mrow .more{padding:0 0 12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 24px}
.mrow.past{opacity:.55}
.todo{color:var(--muted)}
details.syn summary{cursor:pointer;color:var(--accent);font-size:.85rem}
details.syn p{white-space:pre-line;margin:6px 0 0;font-size:.86rem}
/* youth + follow-up */
.ev{display:flex;flex-direction:column;gap:6px}
.ev .meta{font-size:.85rem;color:var(--muted)}
.ev form,.fold{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:10px;padding:12px;margin-top:4px}
.ev input,.ev textarea,.ev select,.fold input,.fold textarea,.fold select,#login input{font:inherit;font-size:.95rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.ok{color:var(--calm);font-weight:600}.err{color:var(--busy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.88rem;background:var(--surface)}
.chips input{display:none}.chips input:checked+span{color:var(--accent);font-weight:600}
.late{color:var(--busy);font-weight:600}
.news{background:var(--accent-soft);border-radius:12px;padding:12px 16px;font-size:.95rem}
.small{font-size:.8rem}
#login{display:flex;gap:8px;max-width:360px}
@media (max-width:700px){.next,.mrow .more{grid-template-columns:1fr}.mrow>summary{grid-template-columns:72px minmax(0,1fr) auto}.mrow>summary .prog{display:none}}
@media (max-width:520px){.row{grid-template-columns:84px minmax(0,1fr)}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000;padding:0;font-size:12px}
  .actions,.note,#back,nav.views{display:none!important}
  .mrow .more{display:grid!important}
  .months{grid-template-columns:repeat(3,1fr);gap:8px}
  .card,.ans,.panel{break-inside:avoid;border-color:#bbb;padding:10px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div><span class="muted" style="font-size:.85rem">خدمة الشباب</span><h1 id="title">خطة السنة</h1><div class="sub" id="sub"></div></div>
    <div class="actions">
      <button type="button" id="back" hidden>→ السنة كلها</button>
      <button type="button" class="primary" id="pdfBtn" hidden>تحميل PDF</button>
      <a class="btn" id="sheetLink" href="#" target="_blank" rel="noopener" hidden>تعديل البيانات</a>
    </div>
  </header>
  <div class="note" id="previewNote" hidden>نسخة تجربة. مواعيد الامتحانات وإجازات الجامعة تقريبية لحد ما تتأكد في الشيت.</div>

  <nav class="views" id="views" aria-label="الصفحات"></nav>
  <div id="home" hidden style="display:flex;flex-direction:column;gap:16px"></div>
  <div id="follow" hidden style="display:flex;flex-direction:column;gap:16px"></div>
  <div id="year" class="months"></div>
  <div id="meet" hidden style="display:flex;flex-direction:column;gap:16px"></div>
  <div id="month" hidden style="display:flex;flex-direction:column;gap:16px"></div>

  <details id="staff" class="small muted" hidden><summary style="cursor:pointer">دخول الخدام</summary><form id="login" style="margin-top:8px"><input type="password" id="pw" placeholder="الباسورد" autocomplete="current-password"><button type="submit">دخول</button></form><p id="loginMsg" class="err"></p></details>
  <footer><span>الزحمة محسوبة من: الامتحانات، والصوم الكبير وأسبوع الآلام، وعدد الإيفنتات المتسجلة.</span><span id="updated"></span></footer>
</div>

<script>
const PREVIEW_DATA = /*__DATA__*/null;
const GM=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const WD=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const LEVEL=["رايق","متوسط","زحمة"];
const PDF_BASE="https://saintbishoy.ca/wp-content/uploads/";
let D=null,startedOnce=false,hashBound=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dm=s=>{const d=parse(s);return `${d.getDate()} ${GM[d.getMonth()]}`};
const fastName=f=>f&&f.startsWith("صيام (")&&!f.includes("أربعاء")?f.replace(/^صيام \((.*)\)$/,"صوم $1"):"";

/* ---- everything we know about one month ---- */
function monthInfo(y,m){
  const n=new Date(y,m+1,0).getDate(), first=iso(new Date(y,m,1)), last=iso(new Date(y,m,n));
  const days=[];for(let i=1;i<=n;i++){const d=new Date(y,m,i);days.push({d,k:iso(d),c:D.cal[iso(d)]})}
  // church: named fasts + main feasts
  const fasts=[];days.forEach(x=>{const f=x.c&&fastName(x.c.fast);if(!f||f==="صوم الأربعاء/جمعة")return;let e=fasts.find(z=>z.name===f);if(!e)fasts.push(e={name:f,from:x.d.getDate(),to:x.d.getDate()});e.to=x.d.getDate()});
  const feasts=[];days.forEach(x=>{if(x.c&&x.c.f&&x.c.m)x.c.f.split("\n").filter(t=>t.startsWith("عيد")||t.includes("القيامة")||t.includes("الشعانين")).slice(0,1).forEach(t=>feasts.push({t,day:x.d.getDate()}))});
  const all=days.flatMap(x=>x.c&&x.c.f?x.c.f.split("\n"):[]);
  const holyWeek=all.some(t=>t.includes("أسبوع الآلام")||t.includes("الجمعة العظيمة"));
  const lentDays=days.filter(x=>x.c&&x.c.fast==="صيام (الكبير)").length;
  const churchParts=[];
  fasts.forEach(f=>churchParts.push(f.from===1&&f.to===n?`${f.name} طول الشهر`:f.from===1?`${f.name} لحد ${f.to}`:`${f.name} من ${f.from}`));
  feasts.slice(0,3).forEach(f=>churchParts.push(`${f.t.replace(" المجيد","")} ${f.day}`));
  // holidays
  const hol=(D.holidays||[]).filter(h=>h.from<=last&&(h.to||h.from)>=first);
  const ovl=h=>{const a=h.from<first?first:h.from,b=(h.to||h.from)>last?last:(h.to||h.from);return Math.round((parse(b)-parse(a))/864e5)+1};
  const exams=hol.filter(h=>h.type==="امتحانات"), examDays=exams.reduce((s,h)=>s+ovl(h),0);
  const offs=hol.filter(h=>h.type==="رسمية"||h.type==="إجازة جامعة");
  const holParts=hol.filter(h=>h.type!=="ملاحظة").map(h=>h.type==="رسمية"?`${h.name} ${h.from===h.to||!h.to?parse(h.from).getDate():parse(h.from).getDate()+"–"+parse(h.to).getDate()}`:`${h.name}${h.from>=first?" من "+parse(h.from).getDate():""}${(h.to||h.from)<=last?" لحد "+parse(h.to).getDate():""}`);
  // events
  const ev=D.events.filter(e=>e.date&&e.status!=="اتلغى"&&e.date<=last&&(e.end||e.date)>=first).sort((a,b)=>a.date.localeCompare(b.date));
  const bigEv=ev.filter(e=>e.type!=="ديدلاين");
  // busy score
  let score=0;const why=[];
  if(examDays>=14){score+=4;why.push("امتحانات")}else if(examDays>=7){score+=2;why.push("امتحانات")}
  if(holyWeek){score+=2;why.push("أسبوع الآلام")}else if(lentDays>=14){score+=1;why.push("الصوم الكبير")}
  if(bigEv.length){score+=Math.ceil(bigEv.length/2);why.push(`${bigEv.length} إيفنت`)}
  const level=score>=4?2:score>=2?1:0;
  // trip
  let trip,tc;
  const uniOff=offs.filter(h=>h.type==="إجازة جامعة");
  // official holidays that fall in Great Lent / Holy Week are not trip days
  const official=offs.filter(h=>{const c=D.cal[h.from];return h.type==="رسمية"&&!(c&&c.fast==="صيام (الكبير)")&&!(c&&c.f&&/الآلام|العظيمة|سبت الفرح|خميس العهد/.test(c.f))});
  const vacStart=uniOff.find(h=>h.from>=first);
  if(examDays>=14&&vacStart){trip=`بعد الامتحانات، من ${parse(vacStart.from).getDate()} (${vacStart.name})`;tc="ok"}
  else if(examDays>=14){trip="صعب، الشباب عندهم امتحانات";tc="no"}
  else if(holyWeek||lentDays>=20){trip="الصوم الكبير: الأنسب يوم روحي أو خلوة";tc="maybe"}
  else if(uniOff.length){trip=`مناسب في ${uniOff[0].name}`;tc="ok"}
  else if(official.length){const h=official[0],d=parse(h.from),wd=d.getDay();const lw=[4,0,5,6].includes(wd);trip=`مناسب حوالين ${h.name} (${WD[wd]} ${d.getDate()})${lw?"، ويك إند طويل":""}`;tc="ok"}
  else if(level===2){trip="الشهر زحمة، الأحسن نأجل";tc="no"}
  else {trip="ممكن في أي ويك إند";tc="maybe"}
  // coptic months
  const cm=[...new Set(days.map(x=>x.c&&x.c.c.split(" ")[1]).filter(Boolean))].join(" ← ");
  return {y,m,n,first,last,days,churchParts,holParts,ev,level,why,trip,tc,cm,examDays};
}

/* ---- one line about each weekly meeting ---- */
function weekTheme(d){
  for(let j=0;j<7;j++){const c=D.cal[iso(addDays(d,j))];if(c&&c.m&&c.f){const t=c.f.split("\n")[0];return j===0?t:`أسبوع ${t} (${WD[addDays(d,j).getDay()]})`}}
  for(let j=0;j<7;j++){const c=D.cal[iso(addDays(d,j))];if(c&&c.f&&/بدء|برمون|كيهك|الصوم الكبير|الخمسين/.test(c.f)){return c.f.split("\n")[0]+(j?` (${WD[addDays(d,j).getDay()]})`:"")}}
  const c=D.cal[iso(d)];if(!c)return "";
  const f=fastName(c.fast);const s=(c.s==="الميلاد"&&d.getMonth()<=2&&iso(d)>=d.getFullYear()+"-01-20")?"الغطاس":c.s;return `موسم ${s}${f&&f!=="صوم أربعاء/جمعة"?" · "+f:""}`;
}

function startMonth(){const t=parse(D.today);const left=new Date(t.getFullYear(),t.getMonth()+1,0).getDate()-t.getDate();return new Date(t.getFullYear(),t.getMonth()+(left<7?1:0),1)}

/* اللي اتعمل قبل كده في نفس الشهر (من جروب الاجتماع) */
function pastFor(m){return (D.history||[]).filter(h=>h.m===m+1)}
function shortName(n){return String(n).split(/[:(]/)[0].replace(/\s*\+.*$/,"").trim()}
/* اللي اتعمل بالتاريخ: نفس الشهر في السنين اللي فاتت، الأحدث الأول */
function pastDatesFor(m){return (D.pastDates||[]).filter(p=>+p.d.slice(5,7)===m+1).sort((a,b)=>b.d.slice(0,4)-a.d.slice(0,4)||a.d.localeCompare(b.d))}
function pastPanel(m){
  const rows=pastDatesFor(m);
  if(rows.length)return `<section class="panel"><h3>اتعمل قبل كده في ${GM[m]}</h3>${rows.map(p=>{const d=parse(p.d);return `<div class="row"><div class="d num">${WD[d.getDay()]} ${d.getDate()}<small>${d.getFullYear()} · ${esc(p.type)}</small></div><div class="t">${esc(p.name)}${p.notes?`<div class="why">${esc(p.notes)}</div>`:""}</div></div>`}).join("")}</section>`;
  const sum=pastFor(m);
  return sum.length?`<section class="panel"><h3>اتعمل قبل كده في ${GM[m]}</h3>${sum.map(h=>`<div class="row"><div class="d"><small>${esc(h.type)}</small></div><div class="t">${esc(h.name)}<div class="why">اتعمل في ${esc(h.years)}${h.notes?" · "+esc(h.notes):""}</div></div></div>`).join("")}</section>`:"";
}
/* نفس الأسبوع في السنين اللي فاتت (من يوم الاجتماع لحد 6 أيام بعده، بنفس اليوم والشهر) */
function pastWeek(d){
  const keys=[];for(let j=0;j<7;j++){const x=addDays(d,j);keys.push(String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"))}
  const rows=(D.pastDates||[]).filter(p=>keys.includes(p.d.slice(5))&&p.d<iso(d)).sort((a,b)=>b.d.localeCompare(a.d));
  if(!rows.length)return "";

function weekChurch(d){
  const feasts=[];for(let j=0;j<7;j++){const x=addDays(d,j),c=D.cal[iso(x)];if(c&&c.f)c.f.split("\n").forEach(t=>feasts.push({t,x,j,m:c.m}))}

}
function hintFor(d){
  const k=iso(d),out=[];
  (D.holidays||[]).forEach(h=>{const a=h.from,b=h.to||h.from;
    if(h.type==="امتحانات"&&k>=a&&k<=b)out.push("الشباب في امتحانات: ممكن يتلغي أو يبقى قصير");
    if(h.type==="رسمية"&&Math.abs((parse(a)-d)/864e5)<=1)out.push(`إجازة ${h.name}: فرصة يتعمل برا الكنيسة`)});
  const c=D.cal[k];
  if(c&&c.f&&/الآلام|العظيمة|خميس العهد/.test(c.f))out.push("أسبوع الآلام: الكل في صلوات البصخة");

}
const rd=r=>r?(r.startsWith("http")?r:PDF_BASE+r):"";
function churchBlock(d,full){

// سنكسار الأسبوع من يوم الاجتماع لحد اليوم اللي قبل الاجتماع الجاي
function weekSyn(d){
  const parts=[];let first="";
  for(let j=0;j<7;j++){const x=addDays(d,j),c=D.cal[iso(x)];if(!c||!c.syn)continue;
    if(!first)first=c.syn.split("\n")[0];

  if(!parts.length)return "";

}

}

  // bookings grouped by event
  const bk={};(D.bookings||[]).forEach(b=>{(bk[b.event+"|"+b.date]=bk[b.event+"|"+b.date]||[]).push(b)});
  const bookEvents=D.events.filter(e=>e.booking||bk[e.title+"|"+e.date]).filter(e=>(e.end||e.date)>=iso(addDays(parse(t),-14)));
  // evaluations
  const ev=D.evals||[];
  const recent=D.events.filter(e=>e.type!=="ديدلاين"&&e.status!=="اتلغى"&&(e.end||e.date)<t&&daysAgo(e.end||e.date)<=30).sort((a,b)=>b.date.localeCompare(a.date));
  const tgt=e=>e.title+" ("+e.date+")";
  const notes=[];ev.forEach(r=>{if(r.closed)return;const idx=r.kind==="إيفنت-شباب"?[2]:r.kind==="إيفنت-خدام"?[3]:[4];idx.forEach(i=>{if(r.a[i])notes.push({r,txt:r.a[i],lbl:r.kind==="إيفنت-شباب"?"يتحسن":r.kind==="إيفنت-خدام"?"مشكلة":"اقتراح"})})});
  const mName=GM[parse(t).getMonth()]+" "+parse(t).getFullYear(),prevD=new Date(parse(t).getFullYear(),parse(t).getMonth()-1,1),prevName=GM[prevD.getMonth()]+" "+prevD.getFullYear();
  const mScore=n=>{const rs=ev.filter(r=>r.kind==="شهري"&&r.target===n);return rs.length?avg(rs.flatMap(r=>[r.a[1],r.a[2]])):""};
  $("follow").innerHTML=`
    ${(D.news||[]).filter(n=>n.show==="الخدام").map(n=>`<div class="news">${esc(n.text)}</div>`).join("")}
    <section class="panel"><h3>مفتوح ومحتاج يتقفل (${late.length+now.length})</h3>
      ${late.length+now.length?late.concat(now).map(taskRow).join(""):`<p class="empty">مفيش حاجة مفتوحة الشهر ده.</p>`}
      ${later.length?`<details><summary class="small muted" style="cursor:pointer;padding-top:8px">بعد كده (${later.length})</summary>${later.map(taskRow).join("")}</details>`:""}
    </section>
    <section class="panel"><h3>الحجوزات</h3>${bookEvents.length?bookEvents.map(e=>{const L=bk[e.title+"|"+e.date]||[],paid=L.filter(b=>b.paid).length;return `<details class="mrow"><summary><span class="d num">${dm(e.date)}<small>${e.booking?"الحجز مفتوح":"الحجز مقفول"}</small></span><span><b>${esc(e.title)}</b></span><span class="muted">${L.length} حجز · ${paid} دفع</span><span></span></summary>${L.map(b=>`<div class="row"><div class="d"><small>${esc(b.at)}</small></div><div class="t">${esc(b.name)} · <span class="num" dir="ltr">${esc(b.phone)}</span>${b.notes?`<div class="why">${esc(b.notes)}</div>`:""}<label class="small"><input type="checkbox" class="pd" data-row="${b.row}" ${b.paid?"checked":""}> دفع</label></div></div>`).join("")||`<p class="empty">لسه مفيش حد حجز.</p>`}</details>`}).join(""):`<p class="empty">مفيش إيفنت الحجز فيه مفتوح. افتح الحجز من عمود "الحجز" في شيت الإيفنتات.</p>`}</section>
    <section class="panel"><h3>التقييمات</h3>
      ${recent.map(e=>{const y=ev.filter(r=>r.kind==="إيفنت-شباب"&&r.target===tgt(e)),s=ev.filter(r=>r.kind==="إيفنت-خدام"&&r.target===tgt(e));return `<div class="row"><div class="d num">${dm(e.date)}</div><div class="t ev" data-row="${e.row}"><b>${esc(e.title)}</b><span class="meta">${y.length?`الشباب ★ ${avg(y.map(r=>r.a[0]))} من ${y.length} رأي`:"لسه مفيش تقييم من الشباب"}${s.length?` · الخدام: التنظيم ★ ${avg(s.map(r=>r.a[1]))}`:""}</span><div class="btns"><button type="button" class="sv small">تقييم الخدام</button></div></div></div>`}).join("")||`<p class="empty">مفيش إيفنتات خلصت آخر 30 يوم.</p>`}
      <div class="row"><div class="d">الشهر</div><div class="t ev"><b>تقييم ${esc(mName)}</b><span class="meta">${mScore(mName)?`★ ${mScore(mName)}`:"لسه متقيمش"}${mScore(prevName)?` (الشهر اللي فات ★ ${mScore(prevName)})`:""}</span><div class="btns"><button type="button" class="mo small">قيّم الشهر</button></div></div></div>
    </section>
    ${notes.length?`<section class="panel"><h3>ملاحظات مفتوحة (${notes.length})</h3>${notes.map(n=>`<div class="row"><div class="d"><small>${esc(n.lbl)}</small></div><div class="t">${esc(n.txt)}<div class="why">${esc(n.r.target)}</div><div class="btns" style="margin-top:4px"><button type="button" class="cl small" data-row="${n.r.row}">اتقفلت</button></div></div></div>`).join("")}</section>`:""}
    <p class="small muted">${D.sheetUrl?`<a href="${esc(D.sheetUrl)}" target="_blank" rel="noopener">فتح الشيت</a> · `:""}<a href="#" id="logout">خروج</a></p>`;
  const F=$("follow"),fail=b=>m=>{b.disabled=false;b.textContent=m};
  F.querySelectorAll(".dn").forEach(b=>b.onclick=()=>{const row=+b.closest("[data-row]").dataset.row,e=D.events.find(x=>x.row===row);b.disabled=true;b.textContent="…";
    callApi("done",{row,title:e.title},()=>{e.status="تم";renderFollow()},fail(b))});
  F.querySelectorAll(".pd").forEach(c=>c.onchange=()=>{const b=(D.bookings||[]).find(x=>x.row===+c.dataset.row);c.disabled=true;callApi("paid",{row:b.row,value:c.checked},()=>{b.paid=c.checked;c.disabled=false},m=>{c.checked=!c.checked;c.disabled=false;alert(m)})});
  F.querySelectorAll(".cl").forEach(b=>b.onclick=()=>{const r=ev.find(x=>x.row===+b.dataset.row);b.disabled=true;callApi("closeEval",{row:r.row},()=>{r.closed=true;renderFollow()},fail(b))});
  F.querySelectorAll(".sv").forEach(b=>b.onclick=()=>{const box=b.closest(".ev"),e=D.events.find(x=>x.row===+box.dataset.row);
    openForm(box,Q_SERV,(a,ok,f)=>callApi("evaluate",{kind:"event-servants",target:tgt(e),answers:a},r=>{(D.evals=D.evals||[]).push({row:0,kind:"إيفنت-خدام",target:tgt(e),a,closed:false});ok(r)},f),()=>"اتسجل ✓")});
  F.querySelectorAll(".mo").forEach(b=>b.onclick=()=>openForm(b.closest(".ev"),Q_MONTH,(a,ok,f)=>callApi("evaluate",{kind:"monthly",target:mName,answers:a},ok,f),()=>"اتسجل ✓"));
  $("logout").onclick=e=>{e.preventDefault();logout()};
}

function renderNav(cur){
  if(!D.level){$("views").hidden=true;return}
  const items=[["follow","المتابعة"],["year","خطة السنة"],...D.weekly.map((w,i)=>["meet-"+(i+1),"اجتماع "+(w.short||w.title.replace("اجتماع ",""))]),["home","صفحة الشباب"]];
  $("views").innerHTML=items.map(([h,l])=>`<a href="#${h}" ${h===cur?'aria-current="page"':""}>${esc(l)}</a>`).join("");
}

function route(){
  let h=location.hash.slice(1);
  if(!D.level)h="home";                                   // الشباب بيشوفوا صفحتهم بس
  else if(!h)h="follow";
  const m=/^m-(\d{4}-\d{2})$/.exec(h), mt=/^meet-(\d+)$/.exec(h), isHome=h==="home", isFollow=h==="follow";
  $("year").hidden=!!(m||mt||isHome||isFollow);$("month").hidden=!m;$("back").hidden=!m;$("meet").hidden=!mt;
  $("home").hidden=!isHome;$("follow").hidden=!isFollow;
  $("pdfBtn").hidden=!!D.preview||isHome||isFollow;
  const w=mt&&D.weekly[+mt[1]-1];
  $("title").textContent=m?"تفاصيل الشهر":w?w.title:isHome?"خدمة الشباب":isFollow?"المتابعة":"خطة السنة";
  renderNav(mt?h:isHome?"home":isFollow?"follow":"year");
  if(isHome)renderHome();
  if(isFollow)renderFollow();
  if(m)renderMonth(m[1]);
  if(mt){meetMonth=null;renderMeet(+mt[1]-1)}
  window.scrollTo(0,0);
}

function start(data){
  D=data;D.holidays=D.holidays||[];
  const t=parse(D.today),c=D.cal[D.today];
  $("sub").textContent=`النهارده ${WD[t.getDay()]} ${t.getDate()} ${GM[t.getMonth()]}${c?" · "+c.c:""}`;
  $("updated").textContent=D.updated?`آخر تحديث: ${D.updated}`:"";
  $("previewNote").hidden=!D.preview;$("pdfBtn").hidden=!!D.preview;
  $("staff").hidden=!!D.level;
  document.querySelector("footer span").hidden=!D.level;
  if(D.sheetUrl){$("sheetLink").href=D.sheetUrl;$("sheetLink").hidden=false}
  $("pdfBtn").onclick=()=>window.print();
  $("back").onclick=()=>{location.hash="year"};
  if(!startedOnce){startedOnce=true;$("login").onsubmit=e=>{e.preventDefault();const k=$("pw").value.trim();if(!k)return;$("loginMsg").textContent="";load(k,true)}}
  if(window.START_VIEW&&!location.hash){try{history.replaceState(null,"","#"+window.START_VIEW)}catch(e){location.hash=window.START_VIEW}}
  renderYear();route();
  if(!hashBound){hashBound=true;window.addEventListener("hashchange",route)}
}

/* الباسورد: من اللينك (?k=) أو اللي اتكتب قبل كده على نفس الموبايل */
let KEY="";try{KEY=window.VIEW_KEY||localStorage.getItem("gsyf_key")||""}catch(e){KEY=window.VIEW_KEY||""}
// كل البيانات بتيجي من Apps Script (نفس الشيت). الصفحة نفسها على GitHub Pages فبتفتح فورًا.
const API="https://script.google.com/macros/s/AKfycbxIUqWldwsg62dQ9WzmNdkbJCPXYyj6XLdQXB615QJ048366UsdQpCrnQYZzmp_QnpZ/exec";
const CACHE_KEY="gsyf_pub_data";
function apiGet(params){return fetch(API+"?"+new URLSearchParams(params)).then(r=>r.json())}
function load(k,fromLogin){
  if(PREVIEW_DATA){start(PREVIEW_DATA);return}
  const key=k===undefined?KEY:k;
  // صفحة الشباب: اعرض آخر بيانات اتشافت على طول، وحدّث في الخلفية
  if(!key&&!fromLogin&&!D){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(c){start(c);$("updated").textContent="بيتحدث…"}}catch(e){}}
  else if(!D){$("sub").textContent="بيحمّل…"}
  apiGet({api:"data",k:key}).then(d=>{
    if(d&&d.ok===false)throw new Error(d.error);
    if(fromLogin&&!d.level){$("loginMsg").textContent="الباسورد غلط";return}
    if(k!==undefined)KEY=k;
    try{d.level?localStorage.setItem("gsyf_key",KEY):localStorage.removeItem("gsyf_key")}catch(e){}
    if(!d.level){try{localStorage.setItem(CACHE_KEY,JSON.stringify(d))}catch(e){}}
    if(fromLogin)location.hash="follow";
    const h=location.hash;start(d);if(h&&location.hash!==h)location.hash=h;
  }).catch(err=>{if(!D)$("sub").textContent="مقدرناش نقرا البيانات، جرّب تاني: "+String(err&&err.message||err);else $("updated").textContent="مقدرناش نحدّث دلوقتي"});
}
/* أي كتابة في الشيت */
function callApi(action,payload,ok,fail){
  if(PREVIEW_DATA){setTimeout(()=>ok({ok:true,pay:"إنستاباي 01xxxxxxxxx (تجربة)"}),300);return}
  apiGet({api:"write",a:action,p:JSON.stringify(payload),k:KEY}).then(r=>{if(r&&r.ok===false)fail(r.error||"حصلت مشكلة");else ok(r)}).catch(e=>fail("مفيش اتصال، جرّب تاني"));
}
function logout(){try{localStorage.removeItem("gsyf_key")}catch(e){}KEY="";location.hash="";load("")}
load();
</script>
